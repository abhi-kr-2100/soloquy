on:
  push: { branches: [release] }

env:
  OCIR_REGISTRY: ocir.ap-hyderabad-1.oci.oraclecloud.com
  OCIR_REPO: soloquybackend

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: soloquy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build image
        run: nix build .#backend

      - name: Load image
        run: docker load -i result

      - name: Get image tag from Nix store path
        id: image-tag
        run: |
          # The nix store hash uniquely identifies the backend build
          TAG=$(basename $(readlink -f result) | cut -d- -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Tag image
        env:
          OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
          IMAGE_TAG: ${{ env.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ env.OCIR_REPO }}:${{ steps.image-tag.outputs.tag }}
        run: |
          docker tag soloquybackend:latest "$IMAGE_TAG"

      - name: Log in to OCIR
        env:
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
        run: printenv OCIR_AUTH_TOKEN | docker login ${{ env.OCIR_REGISTRY }} --username "$OCIR_USERNAME" --password-stdin

      - name: Push image
        env:
          IMAGE_TAG: ${{ env.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ env.OCIR_REPO }}:${{ steps.image-tag.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"

      - name: Upload Terraform configuration
        id: upload-config
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        with:
          organization: soloquy
          workspace: soloquy-backend
          directory: terraform/backend
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}

      - name: Create Terraform run
        id: create-run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        with:
          organization: soloquy
          workspace: soloquy-backend
          configuration_version: ${{ steps.upload-config.outputs.configuration_version_id }}
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}
          TF_VAR_image_tag: '"${{ steps.image-tag.outputs.tag }}"'

      - name: Apply Terraform run
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        with:
          run: ${{ steps.create-run.outputs.run_id }}
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}

      - name: Fetch backend outputs
        id: backend-outputs
        uses: hashicorp/tfc-workflows-github/actions/workspace-output@v1.3.2
        with:
          workspace: soloquy-backend
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}
          TF_CLOUD_ORGANIZATION: soloquy

      - name: Extract instance public IP
        id: extract-ip
        env:
          BACKEND_OUTPUTS: ${{ steps.backend-outputs.outputs.outputs }}
        run: |
          ip=$(echo "$BACKEND_OUTPUTS" | jq -e '
            [.[] | select(.name == "instance_public_ip")] |
            if length == 0 then error("instance_public_ip output not found")
            elif length > 1 then error("multiple instance_public_ip outputs found")
            elif .[0].value == null then error("instance_public_ip value is null")
            elif .[0].value | type != "string" then error("instance_public_ip value is not a string")
            else .[0].value
            end
          ' -r)
          if ! echo "$ip" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "::error::instance_public_ip '$ip' is not a valid IPv4 address"
            exit 1
          fi
          echo "api_url=http://${ip}:8080" >> "$GITHUB_OUTPUT"

      - name: Upload frontend Terraform configuration
        id: upload-frontend-config
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        with:
          organization: soloquy
          workspace: soloquy-frontend
          directory: terraform/frontend
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}

      - name: Create frontend Terraform run
        id: create-frontend-run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        with:
          organization: soloquy
          workspace: soloquy-frontend
          configuration_version: ${{ steps.upload-frontend-config.outputs.configuration_version_id }}
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}
          TF_VAR_ref: '"${{ github.sha }}"'
          TF_VAR_api_url: '"${{ steps.extract-ip.outputs.api_url }}"'

      - name: Apply frontend Terraform run
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        with:
          run: ${{ steps.create-frontend-run.outputs.run_id }}
        env:
          TF_API_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}
